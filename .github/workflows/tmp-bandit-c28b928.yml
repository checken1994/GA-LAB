name: Temp Bandit c28b928

on:
  push:
    branches:
      - audit/tmp-bandit-c28b928

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c28b92886a012ba6818b076197306b140c60cdcd
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Verify exact Bandit policy
        shell: bash
        run: |
          set +e
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          bandit_exit=$?
          set -e
          python tools/summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          python - <<'PY'
          import json
          d=json.load(open('bandit-prod.json', encoding='utf-8'))
          rows=d.get('results', [])
          high=[r for r in rows if r.get('issue_severity')=='HIGH']
          medium=[r for r in rows if r.get('issue_severity')=='MEDIUM']
          print('HIGH', len(high), 'MEDIUM', len(medium), 'TOTAL', len(rows))
          for r in medium:
              print('MEDIUM', r.get('test_id'), r.get('filename'), r.get('line_number'), r.get('issue_text'))
          assert len(high) == 0, len(high)
          assert len(medium) <= 9, len(medium)
          PY
          test "$bandit_exit" -le 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-c28b928
          path: |
            bandit-prod.json
            bandit-prod-summary.json
          retention-days: 2
