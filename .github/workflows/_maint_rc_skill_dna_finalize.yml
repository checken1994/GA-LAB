name: RC Skill DNA finalizer

on:
  push:
    branches:
      - integration/experiment-god-split-and-providers
    paths:
      - .github/workflows/_maint_rc_skill_dna_finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch release authority and product blockers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              '.agents/skills/scp-release-evidence-gate/SKILL.md',
              'Ngăn việc gọi một bản build là “ổn định” chỉ vì nhiều unit test PASS. Release phải có bằng chứng runtime, security, recovery và tái hiện được.\n',
              'Ngăn việc gọi một bản build là “ổn định” chỉ vì nhiều unit test PASS. Release phải có bằng chứng runtime, security, recovery và tái hiện được. Theo SCP DNA #22 và #26, PASS luôn bị giới hạn bởi scope/evidence và Reality giữ quyền cuối cùng.\n',
          )

          replace_exact(
              'scripts/run_system_audit_strict.py',
              'def step_full_pytest() -> dict:\n',
              'def step_skill_dna_contract() -> dict:\n    return _run_pytest(["tests/test_scp_skill_dna_contract.py"], 120)\n\n\ndef step_full_pytest() -> dict:\n',
          )
          replace_exact(
              'scripts/run_system_audit_strict.py',
              '        steps.append(_run_step("import_manifest", base.step_import_check))\n        steps.append(_run_step("boot_and_probe_strict", lambda: step_boot_strict(str(env_file))))\n',
              '        steps.append(_run_step("import_manifest", base.step_import_check))\n        steps.append(_run_step("skill_scp_dna_contract", step_skill_dna_contract))\n        steps.append(_run_step("boot_and_probe_strict", lambda: step_boot_strict(str(env_file))))\n',
          )
          replace_exact(
              'scripts/run_system_audit_strict.py',
              '"schema_version": "scp-strict-system-audit-v5",',
              '"schema_version": "scp-strict-system-audit-v6",',
          )
          replace_exact(
              'scripts/run_system_audit_strict.py',
              '"fail-closed ask semantics, prompt-injection kill/withhold, GOD/provider contracts, "',
              '"fail-closed ask semantics, prompt-injection kill/withhold, mandatory SCP Skill + DNA contract, GOD/provider contracts, "',
          )

          replace_exact(
              '.github/workflows/scp-rc-promotion.yml',
              '      - name: Semantic parity and provider contracts\n',
              '      - name: Mandatory SCP Skill and DNA contract\n        shell: pwsh\n        run: python -m pytest -q tests/test_scp_skill_dna_contract.py --tb=short\n\n      - name: Semantic parity and provider contracts\n',
          )
          replace_exact(
              '.github/workflows/scp-rc-promotion.yml',
              '      - name: Ruff syntax and undefined names\n        run: python -m ruff check scp scripts tools tests --select E9,F\n',
              '      - name: Ruff correctness gate for executable modules\n        run: |\n          python -m compileall -q scp scripts tools tests\n          python -m ruff check scp scripts tools tests --select E9,F601,F811,F821 --extend-exclude "**/*_parts/**"\n',
          )
          replace_exact(
              '.github/workflows/scp-rc-promotion.yml',
              "                  'semantic_parity': 'PASS',\n                  'acceptance': 'PASS',",
              "                  'semantic_parity': 'PASS',\n                  'skill_scp_dna_contract': 'PASS',\n                  'acceptance': 'PASS',",
              count=2,
          )

          replace_exact(
              'tools/run_bounded_system_smoke.py',
              '        "port_8000_free": not port_open(8000),\n        "port_8000_free": not port_open(8000),\n',
              '        "port_8000_free": not port_open(8000),\n',
          )
          replace_exact(
              'tools/run_bounded_system_smoke.py',
              '    if not cleanup["port_8000_free"] or not cleanup["port_8000_free"]:\n',
              '    if not cleanup["port_8000_free"]:\n',
          )
          PY

          git rm -f .github/workflows/_diag_rc_ruff.yml
          git rm -f .github/workflows/_maint_rc_skill_dna_finalize.yml

      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt

      - name: Verify patched release contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scp scripts tools tests
          python -m pytest -q tests/test_scp_skill_dna_contract.py tests/test_god_split_semantic_parity.py tests/test_provider_failover.py tests/test_llm_egress_policy.py --tb=short
          python -m ruff check scp scripts tools tests --select E9,F601,F811,F821 --extend-exclude "**/*_parts/**"

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(rc): enforce Skill DNA and correctness gates"
          git push origin HEAD:integration/experiment-god-split-and-providers
