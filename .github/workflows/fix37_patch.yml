          from __future__ import annotations

          import sqlite3
          from datetime import datetime, timedelta, timezone

          import pytest

          from scp.epistemic.evidence_store import EvidenceStore
          from scp.epistemic.lineage import IndependenceStatus, LineageStore
          from scp.knowledge.knowledge_runtime import (
              GoldLifecycle,
              KnowledgeStore,
              KnowledgeTransitionRejected,
              TemporalRevalidation,
          )
          from scp.knowledge.ontology import KnowledgeObject, KnowledgeStatus
          from scp.knowledge.promotion_authority import PromotionAuthority


          def runtime(tmp_path):
              store = KnowledgeStore(tmp_path / "knowledge.db")
              evidence = EvidenceStore(tmp_path / "epistemic.db", tmp_path / "objects")
              lineage = LineageStore(tmp_path / "epistemic.db")
              authority = PromotionAuthority(evidence, lineage)
              lifecycle = GoldLifecycle(store, promotion_authority=authority)
              obj = KnowledgeObject(
                  type="FACT",
                  title="authority-bound fact",
                  content={"subject": "svc", "predicate": "state", "object": "ok"},
                  scope={"domain": "authority-test"},
              )
              store.upsert(obj)
              return store, evidence, lineage, lifecycle, obj


          def observe(evidence, obj, source, *, reality=False, outcome=None, episode=None):
              metadata = {}
              if reality:
                  metadata = {
                      "scp_authority": "REALITY",
                      "verification_verdict": "VERIFIED",
                      "knowledge_id": obj.knowledge_id,
                      "knowledge_scope": obj.scope,
                  }
                  if outcome is not None:
                      metadata["outcome"] = outcome
                  if episode is not None:
                      metadata["episode_id"] = episode
              return evidence.observe(
                  kind="TEST_RESULT" if reality else "RUNTIME_OBSERVATION",
                  content=f"{source}:{episode or 'obs'}".encode(),
                  collector_id="issue37",
                  collector_version="1",
                  source_id=source,
                  attempt_id=episode,
                  metadata=metadata,
              )["evidence_id"]


          def to_corroborated(store, evidence, lineage, lifecycle, obj):
              a = observe(evidence, obj, "source-a")
              b = observe(evidence, obj, "source-b")
              lifecycle.promote(obj.knowledge_id, evidence_refs=[a])
              lineage.record_relation(
                  "source-a", "source-b",
                  status=IndependenceStatus.INDEPENDENT,
                  basis=[{"type": "independent_runtime_observation"}],
                  evidence_refs=[a, b],
              )
              lifecycle.promote(obj.knowledge_id, evidence_refs=[b])
              return a, b


          def to_verified(store, evidence, lineage, lifecycle, obj):
              to_corroborated(store, evidence, lineage, lifecycle, obj)
              verification = observe(evidence, obj, "reality-verifier", reality=True)
              lifecycle.promote(obj.knowledge_id, verification_evidence_refs=[verification])
              return verification


          def to_gold(store, evidence, lineage, lifecycle, obj):
              to_verified(store, evidence, lineage, lifecycle, obj)
              s1 = observe(evidence, obj, "runner", reality=True, outcome="SUCCESS", episode="e1")
              s2 = observe(evidence, obj, "runner", reality=True, outcome="SUCCESS", episode="e2")
              lifecycle.promote(obj.knowledge_id, success_evidence_refs=[s1, s2])
              return s1, s2


          def test_fake_evidence_id_cannot_curate(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              with pytest.raises(KnowledgeTransitionRejected) as excinfo:
                  lifecycle.promote(obj.knowledge_id, evidence_refs=["ev_nonexistent_issue37"])
              assert any("missing or failed EvidenceStore integrity" in p for p in excinfo.value.missing_pieces)
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.RAW


          def test_forged_independent_lineage_scalar_cannot_corroborate(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              a = observe(evidence, obj, "source-a")
              b = observe(evidence, obj, "source-b")
              lifecycle.promote(obj.knowledge_id, evidence_refs=[a])
              with pytest.raises(KnowledgeTransitionRejected) as excinfo:
                  lifecycle.promote(obj.knowledge_id, evidence_refs=[b], independent_lineages=999)
              assert any("UNKNOWN contributes zero" in p for p in excinfo.value.missing_pieces)
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.CURATED


          def test_arbitrary_verification_id_cannot_grant_verified(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              to_corroborated(store, evidence, lineage, lifecycle, obj)
              arbitrary = observe(evidence, obj, "untrusted-verifier", reality=False)
              with pytest.raises(KnowledgeTransitionRejected) as excinfo:
                  lifecycle.promote(obj.knowledge_id, verification_evidence_refs=[arbitrary])
              assert any("authority-recognized Reality verification" in p for p in excinfo.value.missing_pieces)
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.CORROBORATED


          def test_scalar_success_observations_cannot_grant_gold(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              to_verified(store, evidence, lineage, lifecycle, obj)
              with pytest.raises(KnowledgeTransitionRejected) as excinfo:
                  lifecycle.promote(obj.knowledge_id, success_observations=999999)
              assert any("scalar success_observations cannot grant GOLD" in p for p in excinfo.value.missing_pieces)
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.VERIFIED


          def test_historical_event_cannot_authorize_later_raw_status_update(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              ev = observe(evidence, obj, "source-a")
              lifecycle.promote(obj.knowledge_id, evidence_refs=[ev])

              scheduler = TemporalRevalidation(store, review_after_seconds={"STABLE": 1})
              past = datetime.now(timezone.utc) - timedelta(seconds=10)
              scheduler.assign(obj.knowledge_id, "STABLE", now=past)
              outcomes = scheduler.sweep(now=datetime.now(timezone.utc))
              assert outcomes and outcomes[0].to_status == "UNDER_REVIEW"

              lifecycle.promote(
                  obj.knowledge_id,
                  target=KnowledgeStatus.CURATED,
                  evidence_refs=[ev],
              )
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.CURATED
              assert any(
                  e["from_status"] == "CURATED" and e["to_status"] == "UNDER_REVIEW"
                  for e in store.history(obj.knowledge_id)
              )

              foreign = sqlite3.connect(store.db_path)
              with pytest.raises(sqlite3.Error):
                  foreign.execute(
                      "UPDATE knowledge_objects SET status='UNDER_REVIEW' WHERE knowledge_id=?",
                      (obj.knowledge_id,),
                  )
              foreign.close()
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.CURATED


          def test_insert_or_replace_cannot_bypass_lifecycle(tmp_path):
              store, evidence, lineage, lifecycle, obj = runtime(tmp_path)
              foreign = sqlite3.connect(store.db_path)
              with pytest.raises(sqlite3.IntegrityError):
                  foreign.execute(
                      """
                      INSERT OR REPLACE INTO knowledge_objects (
                          knowledge_id, type, status, title, data_class, payload_json,
                          independent_lineages, evidence_count, volatility,
                          last_validated_at, review_after, created_at, updated_at
                      )
                      SELECT knowledge_id, type, 'GOLD', title, data_class, payload_json,
                             999, 999, volatility, last_validated_at, review_after, created_at, updated_at
                      FROM knowledge_objects WHERE knowledge_id=?
                      """,
                      (obj.knowledge_id,),
                  )
              foreign.close()
              assert store.get(obj.knowledge_id).status is KnowledgeStatus.RAW
          ''', encoding='utf-8')

