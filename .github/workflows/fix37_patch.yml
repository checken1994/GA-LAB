name: Temporary Fix 37 Patch

on:
  push:
    branches:
      - experts-4.0.3-434green
    paths:
      - .github/workflows/fix37_patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: |
          python -m pip install -r scp/requirements-dev.txt
          python -m pip check
      - name: Repair patcher method indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/fix_issue_37.py')
          s = p.read_text(encoding='utf-8')
          old = 'return "".join(lines[: target.lineno - 1]) + _dedent(replacement) + "".join(lines[target.end_lineno :])'
          new = 'return "".join(lines[: target.lineno - 1]) + textwrap.indent(_dedent(replacement), "    ") + "".join(lines[target.end_lineno :])'
          if old not in s:
              raise SystemExit('replace_method helper target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply Issue 37 repair
        run: python tools/fix_issue_37.py
      - name: Close canonical contract gaps exposed by tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('scp/knowledge/promotion_contract.py')
          s = contract.read_text(encoding='utf-8')
          old = '''        if not ctx.contradiction_scan_completed:\n            missing.append("contradiction_scan_completed")\n            \n    elif target_status == KnowledgeStatus.VERIFIED:'''
          new = '''        if not ctx.contradiction_scan_completed:\n            missing.append("contradiction_scan_completed")\n        if ctx.unresolved_material_contradictions > 0:\n            contradictions.append("unresolved_material_contradictions")\n            \n    elif target_status == KnowledgeStatus.VERIFIED:'''
          if old not in s:
              raise SystemExit('CORROBORATED contract marker not found')
          contract.write_text(s.replace(old, new, 1), encoding='utf-8')

          runtime = Path('scp/knowledge/knowledge_runtime.py')
          r = runtime.read_text(encoding='utf-8')
          old_msg = 'f"promotion {current} -> {target_status} REJECTED: {message}",'
          new_msg = 'f"promotion {current} -> {target_status} REJECTED: {message} (the ladder must be walked rung by rung)",'
          if old_msg not in r:
              raise SystemExit('promotion rejection message marker not found')
          runtime.write_text(r.replace(old_msg, new_msg, 1), encoding='utf-8')
          PY
      - name: Run S06 authority tests
        run: >-
          python -m pytest -q
          tests/T02_contract/test_knowledge_promotion.py
          tests/T02_contract/test_knowledge_runtime.py
          tests/T02_contract/test_knowledge_runtime_authority.py
      - name: Commit tested repair
        shell: bash
        run: |
          git config user.name "scp-fix37-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scp/knowledge/promotion_authority.py \
                  scp/knowledge/promotion_contract.py \
                  scp/knowledge/knowledge_runtime.py \
                  tests/T02_contract/test_knowledge_promotion.py \
                  tests/T02_contract/test_knowledge_runtime.py \
                  tests/T02_contract/test_knowledge_runtime_authority.py
          git diff --cached --check
          git commit -s -m "fix(M8): derive knowledge promotion authority (#37)"
          git push origin HEAD:experts-4.0.3-434green
