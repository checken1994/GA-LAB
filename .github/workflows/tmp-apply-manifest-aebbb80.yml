name: Temp Apply Manifest aebbb80

on:
  push:
    branches:
      - audit/tmp-manifest-gen-aebbb80

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/experiment-god-split-and-providers
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Guard exact integration HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="aebbb80defe70b3ae1a4a867e7522b8af3786151"
          test "$actual" = "$expected" || { echo "HEAD moved: $actual"; exit 42; }
      - name: Generate and verify manifest for exact parent
        shell: bash
        run: |
          set -euo pipefail
          target="reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json"
          python tools/create_snapshot_manifest.py --commit HEAD --output "$target"
          git diff --name-only -- "$target"
          changed="$(git diff --name-only)"
          test "$changed" = "$target" || { echo "unexpected changed paths:"; printf '%s\n' "$changed"; exit 43; }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['captured_commit']=='aebbb80defe70b3ae1a4a867e7522b8af3786151'
          assert d['captured_tree']=='b62fb8b7855c676e7ab29b184d3bd6fe28e3e116'
          print(d['tracked_count'], d['inventory_sha256'])
          PY
      - name: Commit manifest only and push guarded child
        shell: bash
        run: |
          set -euo pipefail
          target="reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git diff --cached --name-only | grep -Fx "$target"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore: refresh snapshot manifest for integrated candidate"
          test "$(git rev-parse HEAD^)" = "aebbb80defe70b3ae1a4a867e7522b8af3786151"
          git push origin HEAD:integration/experiment-god-split-and-providers
