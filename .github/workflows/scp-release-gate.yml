name: SCP Release Gate
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: py -3 -m pip install -r scp\requirements-dev.txt
      - shell: pwsh
        run: py -3 -m py_compile scp\api_server.py scp\__main__.py scp\security\auth.py scp\security\production_guard.py scp\security\secret_loader.py scp\autofix\llm_fix.py scp\autofix\runner_phases\ast_scan.py
      - shell: pwsh
        run: py run_reality_tests_portable.py
      - shell: pwsh
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - shell: pwsh
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - shell: pwsh
        working-directory: dashboard
        run: npm run build
