name: SCP Release Gate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
      SCP_PORT: '8000'
      PORT: '8000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Verify the actual commit whose manifest is being reviewed, not the
          # synthetic pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - shell: pwsh
        run: python -m pip install -r scp/requirements-dev.txt
      - name: SCP DNA and required-skill contract gate
        id: skill_contract
        shell: pwsh
        run: python tools/verify_scp_test_skill_contract.py --output reports/test_skill_contract.json
      - name: upload SCP DNA/skill evidence
        if: ${{ always() && matrix.os == 'ubuntu-latest' && (steps.skill_contract.outcome == 'success' || steps.skill_contract.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-test-skill-contract-${{ github.run_id }}
          path: reports/test_skill_contract.json
          if-no-files-found: error
          retention-days: 30
      - shell: pwsh
        run: python -m py_compile scp/runtime/judge.py scp/api_server.py scp/__main__.py scp/security/auth.py scp/security/production_guard.py scp/security/secret_loader.py scp/autofix/llm_fix.py scp/autofix/runner_phases/ast_scan.py scp/autofix/restricted_exec.py scp/runtime/safe_math.py scp/history/migration.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py tools/verify_scp_test_skill_contract.py
      - shell: pwsh
        run: python -m ruff check scp/autofix/llm_fix.py scp/autofix/property_validator.py scp/autofix/realtime_verifier.py scp/autofix/runner_phases/post_fix_verify.py scp/autofix/restricted_exec.py scp/core/knowledge_io.py scp/core/policy_materializer.py scp/history/migration.py scp/runtime/judge_parts/judgecore_mixin.py scp/runtime/safe_math.py scp/security/cisa_kev.py tests/test_enforce_baseline.py tests/test_scp_test_skill_contract.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py tools/verify_scp_test_skill_contract.py --select E9,F
      - shell: pwsh
        run: python -m pytest -q
      - name: bounded live mutation score gate
        id: mutation
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: python scripts/run_mutation_ci.py --max-mutants 5 --min-score 0.40 --report reports/mutation/mutation_report.json
      - name: upload mutation evidence
        if: ${{ always() && matrix.os == 'ubuntu-latest' && (steps.mutation.outcome == 'success' || steps.mutation.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-mutation-evidence-${{ github.run_id }}
          path: reports/mutation/mutation_report.json
          if-no-files-found: error
          retention-days: 14
      - shell: pwsh
        run: |
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          $banditExit = $LASTEXITCODE
          python tools/summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          python tools/check_bandit_policy.py bandit-prod-summary.json --max-medium 9
          if ($banditExit -gt 1) { exit $banditExit }
      - shell: pwsh
        run: python run_reality_tests_portable.py
      - name: bounded full-system runtime smoke (loopback 8000)
        shell: pwsh
        run: python tools/run_bounded_system_smoke.py --output-dir reports/bounded_system_smoke_ci
      - name: upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-bounded-system-smoke-${{ github.run_id }}
          path: reports/bounded_system_smoke_ci/
          if-no-files-found: warn
          retention-days: 7
      - shell: pwsh
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - shell: pwsh
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - shell: pwsh
        working-directory: dashboard
        run: npm run build

      # Metadata evidence is checked last so an intentionally stale snapshot
      # cannot hide semantic/runtime failures on an actively changing candidate.
      # It remains a hard release blocker until regenerated for the frozen SHA.
      - name: snapshot manifest gate
        shell: pwsh
        run: python tools/verify_snapshot_manifest.py reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
