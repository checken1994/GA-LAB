name: SCP Release Gate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
      SCP_PORT: '8000'
      PORT: '8000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Verify the actual commit whose manifest is being reviewed, not the
          # synthetic pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - shell: pwsh
        run: py -3 -m pip install -r scp\requirements-dev.txt
      - shell: pwsh
        run: py -3 -m py_compile scp\api_server.py scp\__main__.py scp\security\auth.py scp\security\production_guard.py scp\security\secret_loader.py scp\autofix\llm_fix.py scp\autofix\runner_phases\ast_scan.py scp\autofix\restricted_exec.py scp\runtime\safe_math.py scp\history\migration.py tools\summarize_bandit_report.py tools\verify_snapshot_manifest.py tools\check_bandit_policy.py
      - shell: pwsh
        run: py -3 tools\verify_snapshot_manifest.py reports\manifests_202608\ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
      - shell: pwsh
        run: py -3 -m ruff check scp\autofix\llm_fix.py scp\autofix\property_validator.py scp\autofix\realtime_verifier.py scp\autofix\runner_phases\reality_test.py scp\autofix\restricted_exec.py scp\core\knowledge_io.py scp\core\policy_materializer.py scp\history\migration.py scp\runtime\judge_parts\judgecore_mixin.py scp\runtime\safe_math.py scp\security\cisa_kev.py tests\test_glm_security_remediation.py tools\summarize_bandit_report.py tools\verify_snapshot_manifest.py tools\check_bandit_policy.py --select E9,F
      - shell: pwsh
        run: py -3 -m pytest -q
      - shell: pwsh
        run: |
          py -3 -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          $banditExit = $LASTEXITCODE
          py -3 tools\summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          py -3 tools\check_bandit_policy.py bandit-prod-summary.json --max-medium 9
          if ($banditExit -gt 1) { exit $banditExit }
      - shell: pwsh
        run: py run_reality_tests_portable.py
      - name: bounded full-system runtime smoke (loopback 8000)
        shell: pwsh
        run: py -3 tools\run_bounded_system_smoke.py --output-dir reports\bounded_system_smoke_ci
      - name: upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-bounded-system-smoke-${{ github.run_id }}
          path: reports/bounded_system_smoke_ci/
          if-no-files-found: warn
          retention-days: 7
      - shell: pwsh
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - shell: pwsh
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - shell: pwsh
        working-directory: dashboard
        run: npm run build
