name: SCP Release Gate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
      SCP_PORT: '8000'
      PORT: '8000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - shell: pwsh
        run: python -m pip install -r scp/requirements-dev.txt
      - name: compile critical paths
        shell: pwsh
        run: python -m py_compile scp/runtime/judge.py scp/api_server.py scp/__main__.py scp/security/auth.py scp/security/production_guard.py scp/security/secret_loader.py scp/autofix/llm_fix.py scp/autofix/runner_phases/ast_scan.py scp/autofix/restricted_exec.py scp/runtime/safe_math.py scp/history/migration.py scp/llm_gateway/free_catalog.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py scripts/mutation_engine.py scripts/scp_soak_test.py scripts/run_scp_acceptance.py

      # Release authority: assembled SCP behavior and durable invariants.
      - name: prepare acceptance workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force reports/scp_acceptance_ci | Out-Null
      - name: SCP acceptance authority
        shell: pwsh
        run: python scripts/run_scp_acceptance.py --output-dir reports/scp_acceptance_ci
      - name: upload SCP acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-acceptance-${{ matrix.os }}-${{ github.run_id }}
          path: reports/scp_acceptance_ci/
          if-no-files-found: error
          retention-days: 14

      # Diagnostics: useful for localization, still blockers, but not a claim
      # that component PASS alone proves the assembled SCP is correct.
      - name: component diagnostics (pytest)
        shell: pwsh
        run: python -m pytest -q
      - name: mutation sensitivity diagnostic
        shell: pwsh
        run: python scripts/mutation_engine.py scp/runtime/judge_llm.py --test tests/external_audit/test_cascade.py --min-score 0.8
      - name: bounded TaskKernel soak diagnostic
        shell: pwsh
        run: python scripts/scp_soak_test.py 0.001
      - name: reality contracts
        shell: pwsh
        run: python scripts/run_reality_tests_portable.py
      - name: static lint gate
        shell: pwsh
        run: python -m ruff check scp/autofix/llm_fix.py scp/autofix/property_validator.py scp/autofix/realtime_verifier.py scp/autofix/runner_phases/reality_test.py scp/autofix/restricted_exec.py scp/core/knowledge_io.py scp/core/policy_materializer.py scp/history/migration.py scp/llm_gateway/free_catalog.py scp/runtime/judge_parts/judgecore_mixin.py scp/runtime/safe_math.py scp/security/cisa_kev.py tests/test_glm_security_remediation.py tests/test_provider_timeout_recovery.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py scripts/mutation_engine.py scripts/scp_soak_test.py scripts/run_scp_acceptance.py tests/test_test_infrastructure_fail_closed.py --select E9,F
      - name: production security scan
        shell: pwsh
        run: |
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          $banditExit = $LASTEXITCODE
          python tools/summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          python tools/check_bandit_policy.py bandit-prod-summary.json --max-medium 9
          if ($banditExit -gt 1) { exit $banditExit }
      - name: dashboard dependencies
        shell: pwsh
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: dashboard audit
        shell: pwsh
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: dashboard build
        shell: pwsh
        working-directory: dashboard
        run: npm run build
      - name: snapshot manifest gate
        shell: pwsh
        run: python tools/verify_snapshot_manifest.py reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
