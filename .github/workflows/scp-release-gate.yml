name: SCP Pre-RC Verification (Non-Authoritative)

# This workflow is broad developer/PR verification only.
# Release authority belongs exclusively to scp-rc-promotion.yml, which requires
# same-SHA mandatory gates, frozen-SHA promotion, explicit human approval, and
# fresh post-merge customer-handoff verification on main.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SCP_JWT_SECRET: "pre-rc-jwt-secret-0123456789abcdef0123456789"
  SCP_ADMIN_KEY: "pre-rc-admin-key-0123456789"
  SCP_PRODUCTION_MODE: '0'
  SCP_SKIP_STARTUP_GATE: '0'
  SCP_EGRESS_MODE: deny
  SCP_PORT: '8000'
  PORT: '8000'
  PYTHONUTF8: '1'

jobs:
  pre-rc-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Test the source SHA rather than GitHub's synthetic PR merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r scp/requirements-dev.txt
          python -m pip check

      - name: Compile selected executable surfaces
        shell: pwsh
        run: >-
          python -m py_compile
          scp/runtime/judge.py
          scp/api_server.py
          scp/__main__.py
          scp/security/auth.py
          scp/security/production_guard.py
          scp/security/secret_loader.py
          scp/autofix/llm_fix.py
          scp/autofix/runner_phases/ast_scan.py
          scp/autofix/restricted_exec.py
          scp/runtime/safe_math.py
          scp/history/migration.py
          tools/summarize_bandit_report.py
          tools/verify_snapshot_manifest.py
          tools/check_bandit_policy.py

      - name: Mandatory SCP Skill and DNA contract
        shell: pwsh
        run: python -m pytest -q tests/test_scp_skill_dna_contract.py --tb=short

      - name: Focused Ruff correctness
        shell: pwsh
        run: >-
          python -m ruff check
          scp/autofix/llm_fix.py
          scp/autofix/property_validator.py
          scp/autofix/realtime_verifier.py
          scp/autofix/runner_phases/post_fix_verify.py
          scp/autofix/restricted_exec.py
          scp/core/knowledge_io.py
          scp/core/policy_materializer.py
          scp/history/migration.py
          scp/runtime/judge_parts/judgecore_mixin.py
          scp/runtime/safe_math.py
          scp/security/cisa_kev.py
          tests/test_enforce_baseline.py
          tools/summarize_bandit_report.py
          tools/verify_snapshot_manifest.py
          tools/check_bandit_policy.py
          --select E9,F

      - name: Full unit and integration suite
        shell: pwsh
        run: python -m pytest -q --tb=short

      - name: Bounded live mutation score gate
        id: mutation
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: python scripts/run_mutation_ci.py --max-mutants 5 --min-score 0.40 --report reports/mutation/mutation_report.json

      - name: Upload mutation evidence
        if: ${{ always() && matrix.os == 'ubuntu-latest' && (steps.mutation.outcome == 'success' || steps.mutation.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-pre-rc-mutation-${{ github.run_id }}
          path: reports/mutation/mutation_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Bandit production policy
        shell: pwsh
        run: |
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          $banditExit = $LASTEXITCODE
          python tools/summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          python tools/check_bandit_policy.py bandit-prod-summary.json --max-medium 9
          if ($banditExit -gt 1) { exit $banditExit }

      - name: Portable reality suite
        shell: pwsh
        run: python run_reality_tests_portable.py

      - name: Bounded full-system runtime smoke
        shell: pwsh
        run: python tools/run_bounded_system_smoke.py --output-dir reports/bounded_system_smoke_pre_rc

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-pre-rc-bounded-smoke-${{ github.run_id }}
          path: reports/bounded_system_smoke_pre_rc/
          if-no-files-found: warn
          retention-days: 7

      - name: Dashboard install
        shell: pwsh
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: Dashboard security audit
        shell: pwsh
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard build
        shell: pwsh
        working-directory: dashboard
        run: npm run build

      # Intentionally no snapshot freeze/verdict/promotion/handoff logic here.
      # Those are authoritative only in scp-rc-promotion.yml.
