name: Temp Apply Bandit Hardening

on:
  push:
    branches:
      - audit/tmp-bandit-05b382

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/experiment-god-split-and-providers
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Guard exact HEAD and harden seven URL fetches
        shell: bash
        run: |
          set -euo pipefail
          expected=05b382ca0aa9620ad0ecd656993a531062c97a78
          test "$(git rev-parse HEAD)" = "$expected" || { echo "integration HEAD moved"; exit 42; }
          python - <<'PY'
          from pathlib import Path

          p = Path('scp/core/knowledge_curation.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import hashlib\nimport json\nimport logging\nimport os\nimport re\nimport time\nimport urllib.parse\nimport urllib.request\n',
                        'import hashlib\nimport json\nimport logging\nimport os\nimport re\nimport time\nimport urllib.parse\n\nimport httpx\n')
          old = '''    url = (\n        "http://export.arxiv.org/api/query?search_query=all:"\n        + urllib.parse.quote(query)\n        + f"&max_results={per_source}&sortBy=relevance"\n    )\n    req = urllib.request.Request(url, headers={"User-Agent": "SCP-Curation/1.0"})\n    with urllib.request.urlopen(req, timeout=15) as resp:\n        text = resp.read(500_000).decode("utf-8", errors="replace")\n'''
          new = '''    url = (\n        "https://export.arxiv.org/api/query?search_query=all:"\n        + urllib.parse.quote(query)\n        + f"&max_results={per_source}&sortBy=relevance"\n    )\n    response = httpx.get(\n        url, headers={"User-Agent": "SCP-Curation/1.0"}, timeout=15.0, follow_redirects=True\n    )\n    response.raise_for_status()\n    text = response.content[:500_000].decode("utf-8", errors="replace")\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    import urllib.request\n    url = (\n        "https://hn.algolia.com/api/v1/search?query="\n        + urllib.parse.quote(query)\n        + f"&tags=story&hitsPerPage={per_source}"\n    )\n    req = urllib.request.Request(url, headers={"User-Agent": "SCP-Curation/1.0"})\n    with urllib.request.urlopen(req, timeout=15) as resp:\n        data = json.loads(resp.read(200_000).decode("utf-8", errors="replace"))\n'''
          new = '''    url = (\n        "https://hn.algolia.com/api/v1/search?query="\n        + urllib.parse.quote(query)\n        + f"&tags=story&hitsPerPage={per_source}"\n    )\n    response = httpx.get(\n        url, headers={"User-Agent": "SCP-Curation/1.0"}, timeout=15.0, follow_redirects=True\n    )\n    response.raise_for_status()\n    data = json.loads(response.content[:200_000].decode("utf-8", errors="replace"))\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    import urllib.request\n    url = (\n        "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance"\n        + f"&q={urllib.parse.quote(query)}&site=stackoverflow&pagesize={per_source}"\n        + "&filter=withbody"\n    )\n    req = urllib.request.Request(url, headers={"User-Agent": "SCP-Curation/1.0"})\n    with urllib.request.urlopen(req, timeout=15) as resp:\n        data = json.loads(resp.read(200_000).decode("utf-8", errors="replace"))\n'''
          new = '''    url = (\n        "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance"\n        + f"&q={urllib.parse.quote(query)}&site=stackoverflow&pagesize={per_source}"\n        + "&filter=withbody"\n    )\n    response = httpx.get(\n        url, headers={"User-Agent": "SCP-Curation/1.0"}, timeout=15.0, follow_redirects=True\n    )\n    response.raise_for_status()\n    data = json.loads(response.content[:200_000].decode("utf-8", errors="replace"))\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('scp/core/multi_source_verifier.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import json\nimport logging\nimport os\nimport re\nimport sys\nimport urllib.parse\n',
                        'import json\nimport logging\nimport os\nimport re\nimport sys\nimport urllib.parse\n\nimport httpx\n')
          old = '''        import urllib.request\n        url = f"https://wttr.in/{urllib.parse.quote(city)}?format=%t"\n        parsed_url = urllib.parse.urlparse(url)\n        if parsed_url.scheme not in ("http", "https"):\n            raise ValueError(f"Unsupported URL scheme: {parsed_url.scheme!r}")\n        req = urllib.request.Request(url, headers={"User-Agent": "curl/7.0"})\n        with urllib.request.urlopen(req, timeout=10) as resp:  # noqa: S310 — scheme validated above; nosec B310 — URL validated by SCP\n            text = resp.read().decode("utf-8", errors="ignore").strip()\n'''
          new = '''        url = f"https://wttr.in/{urllib.parse.quote(city)}?format=%t"\n        parsed_url = urllib.parse.urlparse(url)\n        if parsed_url.scheme != "https" or parsed_url.hostname != "wttr.in":\n            raise ValueError("Unexpected wttr.in endpoint")\n        response = httpx.get(\n            url, headers={"User-Agent": "curl/7.0"}, timeout=10.0, follow_redirects=True\n        )\n        response.raise_for_status()\n        text = response.text.strip()\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        import urllib.parse\n        import urllib.request\n        from urllib.parse import urlencode\n        full_url = f"{search_url}?{urlencode(params)}"\n        _parsed_wd = urllib.parse.urlparse(full_url)\n        if _parsed_wd.scheme not in ("http", "https"):\n            raise ValueError(f"Unsupported URL scheme: {_parsed_wd.scheme!r}")\n        req = urllib.request.Request(full_url, headers={  # noqa: S310 — scheme validated above\n            "User-Agent": "SCPBot/1.0 (research bot)",\n            "Accept": "application/json",\n        })\n        with urllib.request.urlopen(req, timeout=10) as resp:  # noqa: S310 — scheme validated above; nosec B310 — URL validated by SCP\n            data = json.loads(resp.read().decode("utf-8"))\n'''
          new = '''        from urllib.parse import urlencode\n        full_url = f"{search_url}?{urlencode(params)}"\n        _parsed_wd = urllib.parse.urlparse(full_url)\n        if _parsed_wd.scheme != "https" or _parsed_wd.hostname != "www.wikidata.org":\n            raise ValueError("Unexpected Wikidata search endpoint")\n        headers = {\n            "User-Agent": "SCPBot/1.0 (research bot)",\n            "Accept": "application/json",\n        }\n        response = httpx.get(full_url, headers=headers, timeout=10.0, follow_redirects=True)\n        response.raise_for_status()\n        data = response.json()\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        parsed_entity = urllib.parse.urlparse(entity_url)\n        if parsed_entity.scheme not in ("http", "https"):\n            raise ValueError(f"Unsupported URL scheme: {parsed_entity.scheme!r}")\n        req = urllib.request.Request(entity_url, headers={\n            "User-Agent": "SCPBot/1.0 (research bot)",\n            "Accept": "application/json",\n        })\n        with urllib.request.urlopen(req, timeout=10) as resp:  # noqa: S310 — scheme validated above; nosec B310 — URL validated by SCP\n            entity_data = json.loads(resp.read().decode("utf-8"))\n'''
          new = '''        parsed_entity = urllib.parse.urlparse(entity_url)\n        if parsed_entity.scheme != "https" or parsed_entity.hostname != "www.wikidata.org":\n            raise ValueError("Unexpected Wikidata entity endpoint")\n        response = httpx.get(entity_url, headers=headers, timeout=10.0, follow_redirects=True)\n        response.raise_for_status()\n        entity_data = response.json()\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        import urllib.parse\n        import urllib.request\n        clean = entity.strip().replace(" ", "_")\n        url = f"https://en.wikipedia.org/api/rest_v1/page/summary/{urllib.parse.quote(clean)}"\n        _parsed_wiki = urllib.parse.urlparse(url)\n        if _parsed_wiki.scheme not in ("http", "https"):\n            raise ValueError(f"Unsupported URL scheme: {_parsed_wiki.scheme!r}")\n        req = urllib.request.Request(url, headers={  # noqa: S310 — scheme validated above\n            "User-Agent": "SCPBot/1.0 (research bot)",\n            "Accept": "application/json",\n        })\n        with urllib.request.urlopen(req, timeout=10) as resp:  # noqa: S310 — scheme validated above; nosec B310 — URL validated by SCP\n            data = json.loads(resp.read().decode("utf-8"))\n'''
          new = '''        clean = entity.strip().replace(" ", "_")\n        url = f"https://en.wikipedia.org/api/rest_v1/page/summary/{urllib.parse.quote(clean)}"\n        _parsed_wiki = urllib.parse.urlparse(url)\n        if _parsed_wiki.scheme != "https" or _parsed_wiki.hostname != "en.wikipedia.org":\n            raise ValueError("Unexpected Wikipedia endpoint")\n        response = httpx.get(\n            url,\n            headers={"User-Agent": "SCPBot/1.0 (research bot)", "Accept": "application/json"},\n            timeout=10.0,\n            follow_redirects=True,\n        )\n        response.raise_for_status()\n        data = response.json()\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fx 'scp/core/knowledge_curation.py'
          printf '%s\n' "$changed" | grep -Fx 'scp/core/multi_source_verifier.py'
          python -m py_compile scp/core/knowledge_curation.py scp/core/multi_source_verifier.py
      - name: Commit and push guarded hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scp/core/knowledge_curation.py scp/core/multi_source_verifier.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "security: harden curated external fetch paths"
          test "$(git rev-parse HEAD^)" = "05b382ca0aa9620ad0ecd656993a531062c97a78"
          git push origin HEAD:integration/experiment-god-split-and-providers
