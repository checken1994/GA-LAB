name: SCP Snapshot Manifest Draft

on:
  push:
    branches:
      - audit/tmp-manifest-draft-20260901

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate manifest for strict-tested integration commit
        run: >-
          python tools/create_snapshot_manifest.py
          --commit 3406275931e48ad6142f9c663de9f7708b9457a6
          --output /tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
      - name: Verify draft targets exact commit
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path('/tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          expected_commit = '3406275931e48ad6142f9c663de9f7708b9457a6'
          expected_tree = '160c36e89a09e73ee21fd3d1cf58343c375d4a28'
          assert data['captured_commit'] == expected_commit, data['captured_commit']
          assert data['captured_tree'] == expected_tree, data['captured_tree']
          canonical = json.dumps(
              data['inventory'], ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ).encode('utf-8')
          assert hashlib.sha256(canonical).hexdigest() == data['inventory_sha256']
          assert not any(
              row['path'] == 'reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json'
              for row in data['inventory']
          )
          print(data['tracked_count'], data['inventory_sha256'])
          PY
      - name: Publish manifest-only child commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET='3406275931e48ad6142f9c663de9f7708b9457a6'
          BRANCH='integration/experiment-god-split-and-providers'
          MANIFEST='reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json'
          git fetch origin "$BRANCH"
          CURRENT="$(git rev-parse "origin/$BRANCH")"
          if [ "$CURRENT" != "$TARGET" ]; then
            echo "integration head moved: expected $TARGET got $CURRENT" >&2
            exit 1
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp /tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json "$MANIFEST"
          git config user.name 'scp-manifest-audit'
          git config user.email 'scp-manifest-audit@users.noreply.github.com'
          git add "$MANIFEST"
          CHANGED="$(git diff --cached --name-only)"
          if [ "$CHANGED" != "$MANIFEST" ]; then
            echo "refusing non-manifest commit: $CHANGED" >&2
            exit 1
          fi
          git commit -m 'chore: refresh snapshot manifest for integration candidate'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Upload manifest draft
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-snapshot-manifest-draft-${{ github.run_id }}
          path: /tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
          if-no-files-found: error
          retention-days: 3
