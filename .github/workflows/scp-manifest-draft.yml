name: SCP Snapshot Manifest Draft

on:
  push:
    branches:
      - audit/tmp-manifest-draft-20260901

permissions:
  contents: read

jobs:
  verify-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Checkout integration candidate exactly
        run: git checkout --detach 3a253fe480f63bb00ea6bf946a04d3c47c8b2739
      - name: Run exact Release ruff gate
        run: |
          python -m pip install ruff==0.16.1
          python -m ruff check scp/autofix/llm_fix.py scp/autofix/property_validator.py scp/autofix/realtime_verifier.py scp/autofix/runner_phases/post_fix_verify.py scp/autofix/restricted_exec.py scp/core/knowledge_io.py scp/core/policy_materializer.py scp/history/migration.py scp/runtime/judge_parts/judgecore_mixin.py scp/runtime/safe_math.py scp/security/cisa_kev.py tests/test_enforce_baseline.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py --select E9,F
      - name: Generate manifest draft for exact candidate
        run: >-
          python tools/create_snapshot_manifest.py
          --commit 3a253fe480f63bb00ea6bf946a04d3c47c8b2739
          --output /tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
      - name: Verify draft identity and inventory
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path('/tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['captured_commit'] == '3a253fe480f63bb00ea6bf946a04d3c47c8b2739'
          assert data['captured_tree'] == '2de78c2b944182f7f85adb7d6d9184ccc8fa0e16'
          canonical = json.dumps(data['inventory'], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          assert hashlib.sha256(canonical).hexdigest() == data['inventory_sha256']
          print(data['tracked_count'], data['inventory_sha256'])
          PY
      - name: Upload manifest draft
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-snapshot-manifest-draft-${{ github.run_id }}
          path: /tmp/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
          if-no-files-found: error
          retention-days: 3
