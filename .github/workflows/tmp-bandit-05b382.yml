name: Temp Bandit 05b382

on:
  push:
    branches:
      - audit/tmp-bandit-05b382

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 05b382ca0aa9620ad0ecd656993a531062c97a78
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Capture Bandit report
        shell: bash
        run: |
          set +e
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-prod.json
          bandit_exit=$?
          set -e
          python tools/summarize_bandit_report.py bandit-prod.json --output bandit-prod-summary.json
          python - <<'PY'
          import json
          d=json.load(open('bandit-prod.json', encoding='utf-8'))
          rows=[r for r in d.get('results',[]) if r.get('issue_severity') in ('MEDIUM','HIGH')]
          for r in rows:
              print(r['issue_severity'], r.get('test_id'), r.get('filename'), r.get('line_number'), r.get('issue_text'))
          PY
          test "$bandit_exit" -le 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-05b382
          path: |
            bandit-prod.json
            bandit-prod-summary.json
          retention-days: 2
