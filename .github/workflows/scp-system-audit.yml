name: SCP Strict System Audit

on:
  push:
    branches:
      - integration/experiment-god-split-and-providers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-system-audit:
    runs-on: ubuntu-latest
    env:
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Run strict system audit
        run: python -m scripts.run_system_audit_strict
      - name: Upload strict system evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scp-strict-system-audit-${{ github.run_id }}
          path: |
            reports/system_audit_strict/
            reports/reality/reality-tests-results.json
          if-no-files-found: warn
          retention-days: 14
