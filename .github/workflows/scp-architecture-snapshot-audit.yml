name: SCP Architecture Snapshot Audit

on:
  push:
    branches:
      - audit/tmp-manifest-gen-aebbb80
      - audit/tmp-manifest-draft-20260901
  workflow_dispatch:

permissions:
  contents: read

env:
  SCP_JWT_SECRET: audit_ci_secret_32bytes_minimum_value
  SCP_PRODUCTION_MODE: '0'
  SCP_SKIP_STARTUP_GATE: '0'
  SCP_EGRESS_MODE: deny
  SCP_PORT: '8000'
  PORT: '8000'
  PYTHONUTF8: '1'

jobs:
  core-matrix:
    name: core-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "SHA drift: $actual" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python test environment
        shell: pwsh
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Compile and import gate
        shell: pwsh
        run: |
          python -m py_compile scp/runtime/judge.py scp/api_server.py scp/__main__.py scp/security/auth.py scp/security/production_guard.py scp/security/secret_loader.py scp/autofix/llm_fix.py scp/autofix/runner_phases/ast_scan.py scp/autofix/restricted_exec.py scp/runtime/safe_math.py scp/history/migration.py scripts/run_system_audit_strict.py scripts/run_scp_acceptance_ci.py scripts/run_scp_acceptance_ci_impl.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py tools/create_snapshot_manifest.py
          python -c "import scp.api_server, scp.task_kernel, scp.runtime.judge, scp.llm_gateway"
      - name: Strict syntax/name lint gate
        shell: pwsh
        run: python -m ruff check scp/autofix/llm_fix.py scp/autofix/property_validator.py scp/autofix/realtime_verifier.py scp/autofix/runner_phases/post_fix_verify.py scp/autofix/restricted_exec.py scp/core/knowledge_io.py scp/core/policy_materializer.py scp/history/migration.py scp/runtime/judge_parts/judgecore_mixin.py scp/runtime/safe_math.py scp/security/cisa_kev.py tests/test_enforce_baseline.py tools/summarize_bandit_report.py tools/verify_snapshot_manifest.py tools/check_bandit_policy.py --select E9,F
      - name: Unit and integration suite
        shell: pwsh
        run: python -m pytest -q --tb=short

  semantic-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Semantic parity + provider failover/timeout + fail-closed contracts
        run: python -m pytest -q tests/test_god_split_semantic_parity.py tests/test_provider_failover.py tests/test_property_validator_fail_closed.py tests/test_enforce_baseline.py --tb=short
      - name: SCP behavioral acceptance
        run: python scripts/run_scp_acceptance_ci.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-${{ github.sha }}
          path: reports/system_audit_strict/
          if-no-files-found: warn
          retention-days: 14

  security-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Bounded live mutation gate — threshold unchanged
        run: python scripts/run_mutation_ci.py --max-mutants 5 --min-score 0.40 --report reports/mutation/audit-mutation.json
      - name: Bandit production policy — threshold unchanged
        shell: pwsh
        run: |
          python -m bandit -r scp -x scp/tests,scp/examples,scp/tools -f json -o bandit-audit.json
          $banditExit = $LASTEXITCODE
          python tools/summarize_bandit_report.py bandit-audit.json --output bandit-audit-summary.json
          python tools/check_bandit_policy.py bandit-audit-summary.json --max-medium 9
          if ($banditExit -gt 1) { exit $banditExit }
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-mutation-${{ github.sha }}
          path: |
            reports/mutation/audit-mutation.json
            bandit-audit.json
            bandit-audit-summary.json
          if-no-files-found: warn
          retention-days: 14

  reality-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Reality tests
        run: python run_reality_tests_portable.py
      - name: TaskKernel durability/recovery + full strict system audit
        run: python -m scripts.run_system_audit_strict
      - name: Bounded runtime smoke
        run: python tools/run_bounded_system_smoke.py --output-dir reports/bounded_system_smoke_audit
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.sha }}
          path: |
            reports/system_audit_strict/
            reports/reality/reality-tests-results.json
            reports/bounded_system_smoke_audit/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Dashboard deterministic install
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: Dashboard production dependency audit
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard build
        working-directory: dashboard
        run: npm run build

  manifest-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify committed snapshot manifest against Git
        run: python tools/verify_snapshot_manifest.py reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
      - name: Require provenance evidence inside the verified manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/manifests_202608/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          provenance=[name for name in d.get('required_paths', {}) if 'provenance' in name.lower()]
          if not provenance:
              raise SystemExit('verified manifest has no required provenance path')
          print('\n'.join(provenance))
          PY

  snapshot-draft:
    needs: [core-matrix, semantic-acceptance, security-mutation, reality-runtime, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact audit SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate exact snapshot draft for this SHA
        run: |
          mkdir -p generated
          python tools/create_snapshot_manifest.py --commit "${{ github.sha }}" --output generated/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
          python tools/verify_snapshot_manifest.py generated/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-draft-${{ github.sha }}
          path: generated/ROOT_SCP_SNAPSHOT_MANIFEST_20260826.json
          if-no-files-found: error
          retention-days: 14

  final-verdict:
    if: always()
    needs: [core-matrix, semantic-acceptance, security-mutation, reality-runtime, dashboard, manifest-provenance, snapshot-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Produce same-SHA fail-closed verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_REF: ${{ github.ref_name }}
        run: |
          mkdir -p reports/release_verdict
          python - <<'PY'
          import json, os
          from pathlib import Path
          needs=json.loads(os.environ['NEEDS_JSON'])
          results={name: data.get('result') for name, data in needs.items()}
          blockers=[name for name, result in results.items() if result != 'success']
          verdict='DONE' if not blockers else 'BLOCKED'
          out={
              'schema_version':'scp-audit-verdict-v1',
              'candidate_sha':os.environ['CANDIDATE_SHA'],
              'candidate_ref':os.environ['CANDIDATE_REF'],
              'gate_results':results,
              'blocker_count':len(blockers),
              'blockers':blockers,
              'verdict':verdict,
              'frozen_sha':os.environ['CANDIDATE_SHA'] if verdict == 'DONE' else None,
              'rule':'DONE only when every mandatory gate passes on this exact SHA and blocker_count=0',
          }
          path=Path('reports/release_verdict/audit-verdict.json')
          path.write_text(json.dumps(out, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if blockers:
              raise SystemExit(1)
          PY
      - name: Upload final verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-verdict-${{ github.sha }}
          path: reports/release_verdict/audit-verdict.json
          if-no-files-found: error
          retention-days: 30
