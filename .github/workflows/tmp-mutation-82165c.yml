name: Temp Mutation 82165c

on:
  push:
    branches:
      - audit/tmp-mutation-82165c

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    env:
      SCP_JWT_SECRET: dummy_secret_for_ci
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 82165cbbb65fbcb06d7acb1743b4f405ab471a4c
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Run exact mutation gate
        run: python scripts/run_mutation_ci.py --max-mutants 5 --min-score 0.40 --report reports/mutation/mutation_report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-82165c
          path: reports/mutation/mutation_report.json
          if-no-files-found: error
          retention-days: 2
