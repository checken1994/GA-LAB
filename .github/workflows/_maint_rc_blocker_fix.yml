name: One-shot RC blocker repair

on:
  push:
    branches:
      - integration/experiment-god-split-and-providers
    paths:
      - .github/workflows/_maint_rc_blocker_fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prove exact SHA checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Apply exact product and test-isolation fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          predictor = "scp/security/predictor.py"
          replace_once(
              predictor,
              "                except Exception as _why_err:\n            logger.debug(f\"[V9.0-WHY-GATE] WHY Gate error (FAIL-CLOSED): {_why_err}\")",
              "        except Exception as _why_err:\n            logger.debug(f\"[V9.0-WHY-GATE] WHY Gate error (FAIL-CLOSED): {_why_err}\")",
          )
          replace_once(
              predictor,
              "                except Exception as _verify_call_err:\n            logger.debug(f\" _verify_prediction call error (FAIL-CLOSED): {_verify_call_err}\")",
              "        except Exception as _verify_call_err:\n            logger.debug(f\" _verify_prediction call error (FAIL-CLOSED): {_verify_call_err}\")",
          )

          failover = "tests/test_provider_failover.py"
          replace_once(
              failover,
              "def test_env_extra_provider_sits_in_chain(monkeypatch):\n    from scp.llm_gateway.client import LLMGateway, OpenRouterProvider\n\n",
              "def test_env_extra_provider_sits_in_chain(monkeypatch):\n    # Hermetic fake transport still has to declare the egress policy it simulates.\n    monkeypatch.setenv(\"SCP_EGRESS_MODE\", \"allowlist\")\n    monkeypatch.setenv(\"SCP_LLM_EGRESS_ALLOWLIST\", \"openrouter.ai,api.deepseek.com\")\n    from scp.llm_gateway.client import LLMGateway, OpenRouterProvider\n\n",
          )
          replace_once(
              failover,
              "def test_all_providers_down_fails_closed(monkeypatch):\n    from scp.llm_gateway.client import LLMGateway, OpenRouterProvider\n\n",
              "def test_all_providers_down_fails_closed(monkeypatch):\n    # Exercise provider outage, not global egress-deny; network remains a fake client.\n    monkeypatch.setenv(\"SCP_EGRESS_MODE\", \"allowlist\")\n    monkeypatch.setenv(\"SCP_LLM_EGRESS_ALLOWLIST\", \"openrouter.ai\")\n    from scp.llm_gateway.client import LLMGateway, OpenRouterProvider\n\n",
          )

      - name: Prove product fixes before commit
        run: |
          python -m compileall -q scp scripts tools tests
          git diff --check
          grep -F 'SCP_LLM_EGRESS_ALLOWLIST' tests/test_provider_failover.py
          python -m pytest -q tests/test_provider_failover.py tests/test_llm_egress_policy.py

      - name: Commit product fixes only
        run: |
          git config user.name "GA-LAB RC Repair"
          git config user.email "actions@users.noreply.github.com"
          git add scp/security/predictor.py tests/test_provider_failover.py
          git commit -m "fix(rc): close predictor syntax and failover isolation blockers"
          git push origin HEAD:refs/heads/integration/experiment-god-split-and-providers
