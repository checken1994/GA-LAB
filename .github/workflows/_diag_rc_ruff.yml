name: RC Ruff diagnostic

on:
  push:
    branches:
      - integration/experiment-god-split-and-providers
    paths:
      - .github/workflows/_diag_rc_ruff.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Capture diagnostic evidence
        shell: bash
        run: |
          mkdir -p reports/diagnostics
          report=reports/diagnostics/ruff.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "=== TRACKED SUSPECTS ==="
            git ls-files | grep -E 'tests/test_(api_task_crud|control_plane|learning_and_plan|skills|v23_hardening)\.py' || true
            echo "=== STATUS ==="
            git status --short
            for f in tests/test_api_task_crud.py tests/test_control_plane.py tests/test_learning_and_plan.py tests/test_skills.py tests/test_v23_hardening.py; do
              echo "=== $f ==="
              if [ -f "$f" ]; then nl -ba "$f" | sed -n '1,220p'; else echo MISSING; fi
            done
            echo "=== RUFF ==="
            python -m ruff check scp scripts tools tests --select E9,F || true
          } > "$report" 2>&1
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-ruff-diagnostic-${{ github.sha }}
          path: reports/diagnostics/ruff.txt
          if-no-files-found: error
