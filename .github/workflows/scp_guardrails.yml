name: SCP L3 Verification (T00 Meta-Audit & T03 Evidence)

on: [push, pull_request]

permissions:
  contents: read

jobs:
  t00-meta-audit:
    name: "L3: T00 Meta-Audit & Guardrails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scp/requirements-dev.txt
      - name: Run T00 Meta-Audit Tripwire
        run: python tools/t00_meta_audit.py
      - name: Test Inventory / Collection Integrity
        run: |
          echo "Collecting test inventory..."
          pytest tests/ scp/tests/ --collect-only -q

  t03-evidence-authority:
    name: "L3: T03 Evidence Authority"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # If this is a PR, we MUST checkout the exact PR head SHA, not the synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -r scp/requirements-dev.txt
        
      - name: Produce Evidence (FA-03)
        run: |
          mkdir -p .evidence
          python tools/t03_evidence_authority.py produce --out .evidence/scp_core_evidence.json
          
      - name: Validate Evidence (FA-03)
        run: |
          # The validator will check the evidence against the expected SHA (the PR head or branch head)
          EXPECTED_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          python tools/t03_evidence_authority.py validate --in-file .evidence/scp_core_evidence.json --candidate-sha $EXPECTED_SHA
          
      - name: Upload Evidence Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: t03-evidence-record
          path: .evidence/scp_core_evidence.json
          retention-days: 14
