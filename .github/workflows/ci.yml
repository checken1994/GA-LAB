name: SCP CI Gate

on: [push, pull_request]

jobs:
  p0-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scp/requirements.txt
      - name: Enforce Baseline (P0)
        run: python scripts/enforce_baseline.py