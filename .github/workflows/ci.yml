name: SCP CI Gate

on: [push, pull_request]

jobs:
  p0-baseline:
    runs-on: ubuntu-latest
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Enforce SCP DNA and required-skill contract
        run: python tools/verify_scp_test_skill_contract.py --output reports/test_skill_contract.json
      - name: Enforce Baseline (P0)
        run: python scripts/enforce_baseline.py
