name: SCP CI Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  p0-baseline:
    runs-on: ubuntu-latest
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Enforce SCP baseline
        run: python scripts/enforce_baseline.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-baseline-acceptance-${{ github.run_id }}
          path: reports/scp_acceptance_baseline/
          if-no-files-found: error
          retention-days: 14
