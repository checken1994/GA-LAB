name: SCP CI Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  p0-baseline:
    runs-on: ubuntu-latest
    env:
      SCP_JWT_SECRET: "dummy_secret_for_ci"
      SCP_PRODUCTION_MODE: '0'
      SCP_SKIP_STARTUP_GATE: '0'
      SCP_EGRESS_MODE: deny
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: SCP Skill + DNA governance gate
        run: python tools/verify_scp_skill_dna_gate.py
      - name: Enforce Baseline (P0) — hermetic provider layer
        env:
          SCP_EGRESS_MODE: ''
          OPENROUTER_API_KEY: ''
          OPENROUTER_API_KEY_2: ''
          OPENROUTER_API_KEY_3: ''
          OPENAI_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          GEMINI_API_KEY: ''
          GLM_API_KEY: ''
        run: python scripts/enforce_baseline.py
