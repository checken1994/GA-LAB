name: SCP Provider Failover Diagnostic

on:
  push:
    branches: [audit/tmp-manifest-gen-aebbb80]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SCP_EGRESS_MODE: deny
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Trace provider chat control flow
        run: |
          python - <<'PY'
          import asyncio, inspect, itertools, os
          import httpx
          from scp.llm_gateway.client import LLMGateway, OpenRouterProvider

          class FakeResponse:
              def __init__(self, status_code, content=''):
                  self.status_code=status_code; self._content=content
              def raise_for_status(self):
                  if self.status_code >= 400:
                      raise httpx.HTTPStatusError(f'HTTP {self.status_code}', request=None, response=None)
              def json(self):
                  return {'choices':[{'message':{'content':self._content}}]}

          class FakeClient:
              def __init__(self, script): self.script=list(script); self.calls=0
              async def post(self, url, json=None, headers=None):
                  self.calls += 1
                  print('TRACE post', url)
                  if not self.script:
                      raise RuntimeError(f'fake script exhausted at {url}')
                  item=self.script.pop(0)
                  if isinstance(item, Exception): raise item
                  return item

          os.environ['SCP_LLM_FALLBACK_PROVIDERS']='deepseek:DEEPSEEK_API_KEY:DEEPSEEK_BASE_URL:DEEPSEEK_MODEL'
          os.environ['DEEPSEEK_API_KEY']='ds-key-123456'
          os.environ['DEEPSEEK_BASE_URL']='https://api.deepseek.com/v1'
          os.environ['DEEPSEEK_MODEL']='deepseek-chat'
          OpenRouterProvider._API_KEYS=['test-key']
          OpenRouterProvider._key_cycle=itertools.cycle(['test-key'])

          gateway=LLMGateway()
          deepseek=next(p for p in gateway._extra_providers['chat'] if p.PROVIDER_NAME=='deepseek')
          print('CHAT_SOURCE_START')
          print(inspect.getsource(type(deepseek).chat))
          print('CHAT_SOURCE_END')

          orig_key_count=deepseek._key_count
          orig_next_key=deepseek._next_key
          orig_call_model=deepseek._call_model
          orig_is_open=deepseek._breaker.is_open

          def traced_key_count():
              v=orig_key_count(); print('TRACE key_count ->', v); return v
          def traced_next_key():
              v=orig_next_key(); print('TRACE next_key ->', bool(v)); return v
          def traced_is_open():
              v=orig_is_open(); print('TRACE is_open ->', v); return v
          async def traced_call_model(model, messages, api_key):
              print('TRACE call_model enter', model, bool(api_key))
              out=await orig_call_model(model, messages, api_key)
              print('TRACE call_model exit', out)
              return out

          deepseek._key_count=traced_key_count
          deepseek._next_key=traced_next_key
          deepseek._breaker.is_open=traced_is_open
          deepseek._call_model=traced_call_model
          deepseek._client=FakeClient([FakeResponse(200,'direct chat')])

          result=asyncio.run(deepseek.chat('q'))
          print('DIRECT_CHAT_RESULT', result)
          print('DIRECT_CHAT_CALLS', deepseek._client.calls)
          if result[0] != 'direct chat':
              raise SystemExit('direct provider chat failed')
          PY
