name: SCP Provider Failover Diagnostic

on:
  push:
    branches: [audit/tmp-manifest-gen-aebbb80]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SCP_EGRESS_MODE: deny
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scp/requirements-dev.txt
      - name: Reproduce provider failover with state trace
        run: |
          python - <<'PY'
          import asyncio, itertools, os
          import httpx
          from scp.llm_gateway.client import LLMGateway, OpenRouterProvider

          class FakeResponse:
              def __init__(self, status_code, content=''):
                  self.status_code=status_code; self._content=content
              def raise_for_status(self):
                  if self.status_code >= 400:
                      raise httpx.HTTPStatusError(f'HTTP {self.status_code}', request=None, response=None)
              def json(self):
                  return {'choices':[{'message':{'content':self._content}}]}

          class FakeClient:
              def __init__(self, script): self.script=list(script); self.calls=0
              async def post(self, url, json=None, headers=None):
                  self.calls += 1
                  if not self.script:
                      raise RuntimeError(f'fake script exhausted at {url}')
                  item=self.script.pop(0)
                  if isinstance(item, Exception): raise item
                  return item

          os.environ['SCP_LLM_FALLBACK_PROVIDERS']='deepseek:DEEPSEEK_API_KEY:DEEPSEEK_BASE_URL:DEEPSEEK_MODEL'
          os.environ['DEEPSEEK_API_KEY']='ds-key-123456'
          os.environ['DEEPSEEK_BASE_URL']='https://api.deepseek.com/v1'
          os.environ['DEEPSEEK_MODEL']='deepseek-chat'
          OpenRouterProvider._API_KEYS=['test-key']
          OpenRouterProvider._key_cycle=itertools.cycle(['test-key'])

          gateway=LLMGateway()
          chain=gateway._provider_chain('chat')
          print('CHAIN', [(p.PROVIDER_NAME, p.enabled, p.model, p.base_url, p._breaker.is_open()) for p in chain])
          gateway.openrouter_chat._client=FakeClient([FakeResponse(429)])
          deepseek=next(p for p in gateway._extra_providers['chat'] if p.PROVIDER_NAME=='deepseek')
          deepseek._client=FakeClient([FakeResponse(200,'deepseek answers')])
          answer,label=asyncio.run(gateway.chat('q', task='chat'))
          print('RESULT', repr(answer), repr(label))
          print('CALLS', {'openrouter': gateway.openrouter_chat._client.calls, 'deepseek': deepseek._client.calls})
          print('BREAKERS', {'openrouter': gateway.openrouter_chat._breaker.is_open(), 'deepseek': deepseek._breaker.is_open()})
          print('STATS', gateway._stats)
          if answer != 'deepseek answers' or not label.startswith('deepseek:'):
              raise SystemExit('provider failover reproduction failed')
          PY
      - name: Original test with debug logs
        run: python -m pytest -vv tests/test_provider_failover.py::test_env_extra_provider_sits_in_chain --log-cli-level=DEBUG --tb=long
