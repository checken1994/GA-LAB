schema_version: 1
reference_id: complete-scp
reference_version: "1.0.0"

# HOW current production code implements semantic capabilities. The Complete-SCP
# reference remains implementation-name-free. `required_now: true` means the
# binding must import successfully in the P0 checkpoint harness.
bindings:
  epistemic.ontology:
    implementations:
      - scp.knowledge.ontology
    required_now: true

  epistemic.evidence:
    implementations:
      - scp.epistemic.evidence_store
      - scp.epistemic.evidence_writer
    required_now: true

  epistemic.lineage:
    implementations:
      - scp.epistemic.source_identity
      - scp.epistemic.lineage
    required_now: true

  epistemic.calibration:
    implementations:
      - scp.calibration.ledger
      - scp.calibration.legacy_adapter
    required_now: true

  self.capability_map:
    implementations:
      - scp.self_model.capability_map
    required_now: true

  governance.drift_guard:
    implementations:
      - scp.governance.drift_guard
    required_now: true

  governance.privacy_retention:
    implementations:
      - scp.governance.privacy
      - scp.governance.retention
    required_now: true

  intelligence.zero_cost:
    implementations:
      - scp.llm_gateway.zero_cost_guard
      - scp.llm_gateway.zero_cost_runtime
    required_now: true

  cognitive.promotion_authority:
    implementations: []
    required_now: false

  cognitive.doubt_authority:
    implementations: []
    required_now: false

  cognitive.revalidation_authority:
    implementations: []
    required_now: false

  cognitive.experiment_authority:
    implementations: []
    required_now: false
