schema_version: '4.0'
reference_id: complete-scp-structural-cause-effect-matrix
title: Complete SCP Structural Cause-Effect Matrix
description: 'Ma trận machine-readable bao phủ toàn bộ cấu trúc Complete SCP: 12 hệ thống lõi, 8 hệ xuyên suốt,
  các phase P0-P4, authority boundary, dependency, cause-effect, failure/recovery semantics, evidence maturity và
  ánh xạ T00-T11. Đây là structural reference để kiểm SCP hiện tại và tương lai; không phải runtime proof.

  '
document_role:
  type: complete_scp_structural_cause_effect_matrix
  scope: ENTIRE_COMPLETE_SCP
  completeness_rule: 'File chỉ được coi là STRUCTURALLY_COMPLETE khi mọi hệ thống lõi, hệ xuyên suốt, capability
    bắt buộc, authority boundary, cause-effect edge, failure/recovery obligation và T00-T11 mapping đều được khai
    báo và không còn structural gap.

    '
  authority_order:
  - latest_direct_user_instruction
  - AGENTS.md
  - .agents/skills/scp-dna/SKILL.md
  - .agents/skills/scp-dna/references/dna-principles.md
  - spec/complete_scp_reference.yaml
  - spec/protected_invariants.yaml
  - spec/implementation_bindings.yaml
  - relevant_specialized_skill
  - live_runtime_and_same_sha_evidence
  - this_matrix
  must_not_claim:
  - implementation_exists_without_binding_and_code
  - runtime_verified_without_C_or_D_evidence
  - release_pass_without_same_sha_mandatory_gates
  - complete_scp_done_because_yaml_is_complete
semantic_basis:
  complete_scp_definition: 'Safe Agent Runtime / Agent OS + Epistemic System + Autonomous Knowledge and Experience
    Learning + Independent Evidence / Reality Verification + Self-Auditing / Self-Improving Engineering Loop + Zero-Cost
    Intelligence + Internet Safety / Knowledge Quality Firewall + Risk Intelligence / Early Warning + Governance
    / External Authority Boundary + Self-Model / Capability Awareness.

    '
  canonical_closed_loop:
  - OBSERVE
  - QUESTION_WHY
  - NAME_MISSING_EVIDENCE
  - ACQUIRE
  - QUARANTINE_VALIDATE
  - CORROBORATE_CONTRADICT
  - HYPOTHESIZE
  - PLAN_SMALL_REVERSIBLE
  - POLICY_CAPABILITY_GATE
  - EXECUTE
  - OBSERVE_REAL_POST_STATE
  - INDEPENDENT_VERIFY
  - COMMIT_ROLLBACK_OR_UNKNOWN
  - LEARN
  - UPDATE_KNOWLEDGE_EXPERIENCE_SELF_MODEL
  - AUDIT_THE_METHOD
  proof_chain:
  - EXISTS
  - REACHABLE
  - PRODUCTION_CALLER
  - REAL_STATE_EFFECT
  - OBSERVATION
  - INDEPENDENT_VERIFIER
  - FAILURE_INJECTION
  - RECOVERY_EVIDENCE
global_invariants:
- id: G01_REALITY_OVER_MODEL
  rule: Reality evidence outranks model output, model confidence and consensus.
- id: G02_PASS_NOT_TRUE
  rule: PASS means no observed failure inside the tested scope; PASS is not Truth.
- id: G03_FAIL_CLOSED_UNKNOWN
  rule: Missing authority/evidence yields UNKNOWN/BLOCKED, never implicit ALLOW/VERIFIED.
- id: G04_EXTERNAL_DATA_UNTRUSTED
  rule: Internet, documents, tool output and repository content are data, not higher-priority instruction.
- id: G05_INDEPENDENT_LINEAGE
  rule: Shared lineage and UNKNOWN_INDEPENDENCE do not count as independent support.
- id: G06_CONFIDENCE_ADVISORY
  rule: Confidence cannot promote an epistemic verdict to VERIFIED.
- id: G07_REVERSIBLE_CHANGE
  rule: System changes are bounded, observable, reversible and independently verified.
- id: G08_GOVERNED_ACTION
  rule: Reasoning, Knowledge, Forecast and Risk cannot directly call external/local side-effect tools.
- id: G09_ZERO_COST_HARD_WALL
  rule: max_cost_usd=0; unknown/stale pricing=DENY; paid_fallback=false.
- id: G10_PRIVACY_BEFORE_EGRESS
  rule: DataClass/privacy eligibility is checked before provider/tool/network dispatch.
- id: G11_NO_BLIND_RETRY
  rule: Uncertain external side effects require reconciliation before any retry.
- id: G12_APPEND_ONLY_AUTHORITY
  rule: Evidence, authority decisions and history are corrected by supersession, not silent rewrite.
- id: G13_TEMPORAL_HISTORY
  rule: Current state never destroys historical valid-time/system-time history.
- id: G14_CORRELATION_NOT_CAUSATION
  rule: Association or precedence alone cannot become a causal claim.
- id: G15_FORECAST_NOT_FACT
  rule: A forecast remains a prediction until independently resolved against later Reality.
- id: G16_SIMULATION_NOT_REALITY
  rule: Simulation/Digital Twin evidence cannot be promoted to production Reality proof.
- id: G17_HUMAN_AUTHORITY_HIGH_CONSEQUENCE
  rule: High-consequence external authority/action remains human-governed where contract requires it.
- id: G18_NO_MANUFACTURED_GREEN
  rule: No delete/skip/xfail/threshold weakening/fail-open change may manufacture PASS.
- id: G19_SAME_SHA_RELEASE_EVIDENCE
  rule: Mandatory verification/release evidence binds the exact tested SHA and test profile.
- id: G20_SELF_MODEL_EVIDENCE
  rule: Capability maturity derives from evidence, not class/function existence.
- id: G21_LEARNING_CANNOT_WEAKEN_AUTHORITY
  rule: Learning/AutoFix cannot weaken DNA, Evidence, Reality, security, privacy, zero-cost or release authority.
- id: G22_UNKNOWN_MUST_BE_REMEMBERED
  rule: Unresolved questions, blind spots, contradictions and missing observability remain durable.
maturity_model:
  M0: IDEA
  M1: SPECIFIED
  M2: STATIC_PRESENT
  M3: INTEGRATED
  M4: C_RUNTIME_VERIFIED
  M5: D_RECOVERY_VERIFIED
  M6: RELEASE_GATED
  rule: No maturity jump may be inferred from lower-level evidence.
phase_model:
  rule: 'Phase controls implementation order, not membership in Complete SCP. A future capability remains part of
    the complete structural inventory even when implementation_status=MISSING.

    '
  phases:
    P0:
      name: FOUNDATION_AUTHORITY
      purpose: Evidence, lineage, ontology, calibration, self-model, governance, privacy, zero-cost and durable
        execution foundations.
    P1:
      name: COGNITIVE_CONTROL
      purpose: Promotion, doubt, contradiction, revalidation, hypotheses, experiments, lessons, benchmark and cognitive
        orchestration.
    P2:
      name: WORLD_INTELLIGENCE
      purpose: Safe acquisition, entity/event identity, bitemporal world state, change, geo, causality, forecasting,
        risk and early warning.
    P3:
      name: AUTONOMOUS_COORDINATION
      purpose: Resource planning, simulation, bounded multi-agent coordination, incident command and long-running
        missions.
    P4:
      name: EXTERNAL_OPERATION_CONTINUITY
      purpose: Authorized external connectors, high-consequence boundaries, human command, continuity and disaster
        recovery at full-system scope.
structural_inventory:
  required_core_systems: 12
  required_cross_cutting_systems: 8
  required_test_gates: 12
  core_system_ids:
  - S01_EXECUTION_OS
  - S02_ZERO_COST_INTELLIGENCE
  - S03_INTERNET_ACQUISITION
  - S04_INTERNET_SAFETY
  - S05_EVIDENCE_SYSTEM
  - S06_KNOWLEDGE_SYSTEM
  - S07_EXPERIENCE_SYSTEM
  - S08_REASONING_SYSTEM
  - S09_SELF_IMPROVEMENT
  - S10_RISK_INTELLIGENCE
  - S11_GOVERNANCE
  - S12_SELF_AWARENESS_AUDIT
  cross_cutting_ids:
  - X01_IDENTITY_TRUST
  - X02_OBSERVABILITY_CAUSAL_TELEMETRY
  - X03_RESOURCE_GOVERNOR
  - X04_SUPPLY_CHAIN
  - X05_DISASTER_RECOVERY
  - X06_SIMULATION_DIGITAL_TWIN
  - X07_MULTI_AGENT_COORDINATION
  - X08_WORLD_STATE_TEMPORAL_MODEL
capability_defaults:
  complete_scp_required: true
  implementation_status_source: self.capability_map + live implementation_bindings + same-SHA evidence
  missing_implementation_semantics: Capability remains in structural inventory; implementation_status=MISSING/BLOCKED,
    never omitted.
core_systems:
  S01_EXECUTION_OS:
    name: Execution OS
    phase_focus:
    - P0
    - P3
    - P4
    purpose: Turn governed intent into durable bounded action, observation, verification and artifact.
    authority_owners:
    - TaskKernelAuthority
    - CapabilityAuthority
    - GovernanceAuthority
    - RealityVerifier
    capabilities:
    - id: execution.task_kernel
      target_maturity: M5
      phase: P0
    - id: execution.capability_security
      target_maturity: M5
      phase: P0
    - id: execution.scheduler_supervisor
      target_maturity: M5
      phase: P3
    - id: execution.hands_tools
      target_maturity: M4
      phase: P0
    - id: execution.recovery_reconciliation
      target_maturity: M5
      phase: P0
    - id: execution.kill_switch
      target_maturity: M5
      phase: P0
    depends_on:
    - S11_GOVERNANCE
    - X02_OBSERVABILITY_CAUSAL_TELEMETRY
    - X03_RESOURCE_GOVERNOR
    - X05_DISASTER_RECOVERY
    forbidden_paths:
    - model -> direct_tool_side_effect
    - knowledge -> direct_tool_side_effect
    - unknown_external_outcome -> blind_retry
    cause_effect_edges:
    - id: CE-S01-01
      cause: Governed ActionProposal is authorized with a scoped capability.
      authority_path:
      - GovernanceAuthority
      - CapabilityAuthority
      - TaskKernelAuthority
      - ToolDriver
      - RealityVerifier
      effects:
      - durable_intent
      - bounded_action
      - post_state_observation
      - verification_record
      - commit_or_rollback
      must_not_effect:
      - unscoped_tool_access
      - silent_external_write
      evidence_target: C
      gates:
      - T03
      - T04
      - T08
      - T09
    - id: CE-S01-02
      cause: Process crashes after possible external side effect but before durable observation.
      authority_path:
      - TaskKernelAuthority
      - RecoveryAuthority
      effects:
      - RECONCILE_REQUIRED
      - no_blind_retry
      - external_post_state_check
      must_not_effect:
      - automatic_action_replay
      evidence_target: D
      gates:
      - T04
      - T10
  S02_ZERO_COST_INTELLIGENCE:
    name: Zero-Cost Intelligence Fabric
    phase_focus:
    - P0
    - P1
    purpose: Use only price-verified free intelligence while preserving quality, privacy, quota and resilience semantics.
    authority_owners:
    - PricingProofAuthority
    - ZeroCostPEP
    - ProviderRegistryAuthority
    - QuotaLedgerAuthority
    - AdaptiveRouter
    capabilities:
    - id: intelligence.zero_cost
      target_maturity: M4
      phase: P0
    - id: intelligence.provider_registry
      target_maturity: M4
      phase: P1
    - id: intelligence.quota_ledger
      target_maturity: M4
      phase: P1
    - id: intelligence.free_qualification
      target_maturity: M4
      phase: P1
    - id: intelligence.adaptive_free_router
      target_maturity: M4
      phase: P1
    - id: intelligence.cache_coalescing
      target_maturity: M3
      phase: P1
    depends_on:
    - S11_GOVERNANCE
    - S12_SELF_AWARENESS_AUDIT
    - X02_OBSERVABILITY_CAUSAL_TELEMETRY
    - X03_RESOURCE_GOVERNOR
    forbidden_paths:
    - complexity -> paid_model
    - free_by_name -> authorization
    - unknown_price -> network_dispatch
    - free_model -> bypass_privacy
    cause_effect_edges:
    - id: CE-S02-01
      cause: An LLM task requires a model.
      authority_path:
      - AdaptiveRouter
      - PrivacyPolicy
      - PricingProofAuthority
      - ZeroCostPEP
      - ProviderDriver
      effects:
      - rank_verified_free_candidates
      - dispatch_only_exact_zero_price_and_eligible_candidate
      must_not_effect:
      - paid_fallback
      - unknown_price_dispatch
      evidence_target: C
      gates:
      - T05
      - T08
    - id: CE-S02-02
      cause: All qualified verified-free candidates are exhausted, rate-limited or unhealthy.
      authority_path:
      - QuotaLedgerAuthority
      - ProviderRegistryAuthority
      - AdaptiveRouter
      effects:
      - WAITING_FREE_QUOTA_or_BLOCKED
      - next_eligible_time_if_known
      must_not_effect:
      - paid_fallback
      - quality_requirement_weakening
      evidence_target: C
      gates:
      - T05
      - T10
  S03_INTERNET_ACQUISITION:
    name: Internet Acquisition
    phase_focus:
    - P2
    purpose: Acquire external observations for explicit questions, revalidation, monitoring or evidence needs without
      unbounded crawling.
    authority_owners:
    - AcquisitionAuthority
    - SourceRegistryAuthority
    - AcquisitionScheduler
    capabilities:
    - id: world.acquisition
      target_maturity: M4
      phase: P2
    - id: world.source_registry
      target_maturity: M4
      phase: P2
    - id: world.discovery
      target_maturity: M3
      phase: P2
    - id: world.monitor_policy
      target_maturity: M4
      phase: P2
    - id: world.free_api_qualification
      target_maturity: M4
      phase: P2
    depends_on:
    - S04_INTERNET_SAFETY
    - S05_EVIDENCE_SYSTEM
    - S11_GOVERNANCE
    - X03_RESOURCE_GOVERNOR
    - X08_WORLD_STATE_TEMPORAL_MODEL
    forbidden_paths:
    - crawler -> direct_knowledge
    - discovered_host -> automatic_egress_allow
    - curiosity -> unbounded_monitoring
    cause_effect_edges:
    - id: CE-S03-01
      cause: User/OpenQuestion/Revalidation/RiskMonitor requests an external observation.
      authority_path:
      - AcquisitionAuthority
      - SourcePolicy
      - InternetSafety
      - EvidenceAuthority
      effects:
      - bounded_fetch
      - source_identity
      - evidence_occurrence
      - world_observation
      must_not_effect:
      - direct_knowledge_write
      - direct_action
      evidence_target: C
      gates:
      - T02
      - T03
      - T08
      - T09
    - id: CE-S03-02
      cause: Acquisition resource or rate budget is exhausted.
      authority_path:
      - AcquisitionScheduler
      - ResourceGovernor
      effects:
      - WAIT_RESOURCE_or_BLOCKED
      - preserve_pending_need
      must_not_effect:
      - budget_self_increase
      - paid_provider_switch
      evidence_target: C
      gates:
      - T08
      - T10
  S04_INTERNET_SAFETY:
    name: Internet Safety and Knowledge Quality Firewall
    phase_focus:
    - P0
    - P2
    purpose: Keep external content untrusted, bounded, non-executable and provenance-preserving before it reaches
      evidence/knowledge.
    authority_owners:
    - URLGuard
    - SafeFetcher
    - QuarantineAuthority
    - ThreatScanner
    - PrivacyIngressAuthority
    - QualityFirewall
    capabilities:
    - id: internet.ssrf_egress_guard
      target_maturity: M5
      phase: P0
    - id: internet.raw_quarantine
      target_maturity: M4
      phase: P0
    - id: internet.prompt_injection_firewall
      target_maturity: M4
      phase: P2
    - id: internet.malware_dangerous_data_guard
      target_maturity: M4
      phase: P2
    - id: internet.secret_pii_ingress
      target_maturity: M4
      phase: P0
    - id: internet.quality_spam_dedupe
      target_maturity: M4
      phase: P2
    depends_on:
    - S11_GOVERNANCE
    - S05_EVIDENCE_SYSTEM
    - X01_IDENTITY_TRUST
    - X03_RESOURCE_GOVERNOR
    forbidden_paths:
    - external_text -> system_instruction
    - raw_quarantined_content -> planner_action
    - redirect -> skip_ssrf_recheck
    - executable_archive -> auto_execute
    cause_effect_edges:
    - id: CE-S04-01
      cause: Fetched content contains prompt injection, hidden control text or exfiltration instructions.
      authority_path:
      - QuarantineAuthority
      - ThreatScanner
      - PrivacyIngressAuthority
      effects:
      - remain_untrusted
      - threat_flags
      - safe_extraction_or_quarantine
      must_not_effect:
      - system_prompt_override
      - ActionProposal_from_payload
      evidence_target: C
      gates:
      - T03
      - T07
    - id: CE-S04-02
      cause: URL resolves or redirects to disallowed/private/link-local/metadata target.
      authority_path:
      - URLGuard
      - EgressPolicy
      effects:
      - DENY
      - security_event
      must_not_effect:
      - network_dispatch_to_denied_target
      evidence_target: C
      gates:
      - T03
      - T10
  S05_EVIDENCE_SYSTEM:
    name: Evidence System
    phase_focus:
    - P0
    - P1
    - P2
    purpose: Preserve immutable observation occurrences, provenance, lineage, contradictions and Reality evidence.
    authority_owners:
    - EvidenceStore
    - SourceIdentityAuthority
    - LineageAuthority
    - ContradictionAuthority
    - RealityVerifier
    capabilities:
    - id: epistemic.evidence
      target_maturity: M4
      phase: P0
    - id: epistemic.source_identity
      target_maturity: M4
      phase: P0
    - id: epistemic.lineage
      target_maturity: M4
      phase: P0
    - id: epistemic.claims
      target_maturity: M4
      phase: P1
    - id: epistemic.contradiction
      target_maturity: M4
      phase: P1
    - id: epistemic.reality_verification
      target_maturity: M5
      phase: P0
    depends_on:
    - X01_IDENTITY_TRUST
    - X02_OBSERVABILITY_CAUSAL_TELEMETRY
    - S11_GOVERNANCE
    forbidden_paths:
    - model_response -> truth
    - source_count -> independent_support
    - evidence_update_in_place
    - stale_evidence -> current_state_proof
    cause_effect_edges:
    - id: CE-S05-01
      cause: The same content is observed twice at different times.
      authority_path:
      - EvidenceStore
      effects:
      - two_evidence_occurrences
      - shared_content_hash_allowed
      - distinct_observed_at
      must_not_effect:
      - occurrence_deduplication
      evidence_target: C
      gates:
      - T02
      - T06
    - id: CE-S05-02
      cause: Multiple reports share one upstream lineage.
      authority_path:
      - SourceIdentityAuthority
      - LineageAuthority
      effects:
      - report_count_may_increase
      - independent_support_collapsed_to_conservative_lower_bound
      must_not_effect:
      - manufactured_corroboration
      evidence_target: C
      gates:
      - T06
      - T07
      - T09
    - id: CE-S05-03
      cause: Reality evidence contradicts a model/knowledge claim.
      authority_path:
      - RealityVerifier
      - ContradictionAuthority
      effects:
      - CONTRADICTED_or_UNDER_REVIEW_path
      - contradiction_preserved
      must_not_effect:
      - delete_conflicting_evidence
      - model_self_override
      evidence_target: C
      gates:
      - T06
      - T07
  S06_KNOWLEDGE_SYSTEM:
    name: Knowledge System
    phase_focus:
    - P0
    - P1
    - P2
    purpose: Manage ontology, epistemic maturity, temporal validity, promotion/demotion and scoped reusable knowledge.
    authority_owners:
    - OntologyAuthority
    - PromotionAuthority
    - RevalidationAuthority
    - KnowledgeStoreAuthority
    capabilities:
    - id: epistemic.ontology
      target_maturity: M4
      phase: P0
    - id: cognitive.promotion_authority
      target_maturity: M4
      phase: P1
    - id: cognitive.revalidation_authority
      target_maturity: M4
      phase: P1
    - id: knowledge.temporal_validity
      target_maturity: M4
      phase: P1
    - id: knowledge.retrieval_index
      target_maturity: M3
      phase: P1
    - id: knowledge.gold_lifecycle
      target_maturity: M4
      phase: P1
    depends_on:
    - S05_EVIDENCE_SYSTEM
    - S08_REASONING_SYSTEM
    - S11_GOVERNANCE
    - X08_WORLD_STATE_TEMPORAL_MODEL
    forbidden_paths:
    - external_data -> knowledge
    - confidence -> VERIFIED
    - experiment_success -> GOLD
    - vector_index -> truth_authority
    cause_effect_edges:
    - id: CE-S06-01
      cause: Knowledge promotion is requested.
      authority_path:
      - PromotionAuthority
      - EvidenceAuthority
      - LineageAuthority
      - ContradictionAuthority
      - RealityVerifier_if_required
      effects:
      - PROMOTE_HOLD_UNDER_REVIEW_DEMOTE_RETIRE_or_BLOCKED
      - immutable_decision
      must_not_effect:
      - direct_status_mutation
      - confidence_override
      evidence_target: C
      gates:
      - T02
      - T06
      - T07
    - id: CE-S06-02
      cause: VERIFIED/GOLD knowledge becomes stale or receives material contradiction.
      authority_path:
      - RevalidationAuthority
      - ContradictionAuthority
      - PromotionAuthority
      effects:
      - UNDER_REVIEW
      - revalidation_job_or_demotion_path
      - history_preserved
      must_not_effect:
      - silent_current_VERIFIED
      - history_overwrite
      evidence_target: C
      gates:
      - T06
      - T07
      - T10
  S07_EXPERIENCE_SYSTEM:
    name: Experience System
    phase_focus:
    - P1
    purpose: Store public decision traces, failures, episodes, reasoning patterns and strategies without treating
      one episode as universal truth.
    authority_owners:
    - EpisodeAuthority
    - FailureMemoryAuthority
    - StrategyMemoryAuthority
    capabilities:
    - id: experience.episodes
      target_maturity: M4
      phase: P1
    - id: experience.failure_memory
      target_maturity: M4
      phase: P1
    - id: experience.reasoning_patterns
      target_maturity: M4
      phase: P1
    - id: experience.strategy_library
      target_maturity: M4
      phase: P1
    - id: experience.human_workflows
      target_maturity: M3
      phase: P1
    depends_on:
    - S05_EVIDENCE_SYSTEM
    - S06_KNOWLEDGE_SYSTEM
    - S08_REASONING_SYSTEM
    forbidden_paths:
    - one_success_episode -> universal_rule
    - private_hidden_chain_of_thought -> required_memory
    cause_effect_edges:
    - id: CE-S07-01
      cause: A task or experiment finishes with a verified outcome.
      authority_path:
      - EpisodeAuthority
      - EvidenceAuthority
      effects:
      - episode_record
      - failure_or_success_memory
      - candidate_lesson_or_strategy
      must_not_effect:
      - automatic_VERIFIED_lesson
      evidence_target: C
      gates:
      - T07
      - T08
      - T09
    - id: CE-S07-02
      cause: A similar task is planned after a known historical failure pattern.
      authority_path:
      - FailureMemoryAuthority
      - StrategyMemoryAuthority
      - ReasoningAuthority
      effects:
      - surface_prior_failure
      - adjust_hypotheses_or_guardrails
      must_not_effect:
      - blind_repeat_known_failure
      evidence_target: C
      gates:
      - T07
      - T09
  S08_REASONING_SYSTEM:
    name: Reasoning System
    phase_focus:
    - P1
    - P2
    purpose: Turn questions and evidence into explicit missing pieces, hypotheses, experiments, causal assessments
      and calibrated decisions.
    authority_owners:
    - DoubtAuthority
    - HypothesisAuthority
    - ExperimentAuthority
    - CausalAuthority
    - CalibrationAuthority
    - CognitiveOrchestrator
    capabilities:
    - id: cognitive.doubt_authority
      target_maturity: M4
      phase: P1
    - id: cognitive.hypothesis_authority
      target_maturity: M4
      phase: P1
    - id: cognitive.experiment_authority
      target_maturity: M4
      phase: P1
    - id: reasoning.causal
      target_maturity: M4
      phase: P2
    - id: epistemic.calibration
      target_maturity: M4
      phase: P0
    - id: cognitive.orchestrator
      target_maturity: M4
      phase: P1
    depends_on:
    - S05_EVIDENCE_SYSTEM
    - S06_KNOWLEDGE_SYSTEM
    - S07_EXPERIENCE_SYSTEM
    - S11_GOVERNANCE
    - S12_SELF_AWARENESS_AUDIT
    forbidden_paths:
    - WHY_output -> final_truth
    - correlation -> CAUSES
    - experiment_result -> VERIFIED
    - orchestrator -> bypass_authority
    cause_effect_edges:
    - id: CE-S08-01
      cause: Evidence is insufficient or a blind spot/contradiction is detected.
      authority_path:
      - DoubtAuthority
      - SelfModel
      - HypothesisAuthority
