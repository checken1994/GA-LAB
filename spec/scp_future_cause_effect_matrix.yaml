test_architecture:
  T00:
    dir: tests/T00_integrity
    name: Test Integrity and Meta-Audit
    obligations:
    - detect placeholder/assert-true/unconditional skip/xfail
    - detect invented API or broken production binding
    - detect fake C/D evidence labels
    - detect capability without required test mappings
    - detect weakened protected invariants
    - classify HARNESS_BROKEN / PRODUCT_BLOCKED / PRODUCT_FAIL / PASS_WITHIN_SCOPE
  T01:
    dir: tests/T01_boot
    name: Boot and Reproducibility
    obligations:
    - clean boot/start/stop
    - schema/migration/integrity fail-closed
    - config/manifest/lock reproducibility
    - unclean-shutdown recovery classification
  T02:
    dir: tests/T02_contract
    name: Semantic and Contract
    obligations:
    - IDs/schema/state transitions
    - ontology and authority contracts
    - entity/event/bitemporal semantics
    - common event envelope
  T03:
    dir: tests/T03_capability
    name: Trust, Capability and Internet Safety
    obligations:
    - deny-by-default capability and PEP
    - SSRF/egress/path/secret/privacy/sandbox
    - prompt-injection quarantine
    - human comprehension and external authority
    - risk cannot bypass governance
  T04:
    dir: tests/T04_kernel
    name: Kernel and Durable State
    obligations:
    - journal/projection/lease/fencing/checkpoint/idempotency
    - kill switch
    - reconciliation state
    - bounded monitor/task lifecycle
  T05:
    dir: tests/T05_gateway
    name: Gateway and Zero-Cost
    obligations:
    - exact-zero fresh pricing proof
    - unknown/stale/paid deny before dispatch
    - verified-free failover only
    - quota/circuit breaker/backoff/retry-after
    - privacy before provider
    - no paid fallback
  T06:
    dir: tests/T06_verifier
    name: Evidence and Reality
    obligations:
    - real observation and provenance
    - lineage independence
    - stale/self-report rejection
    - contradiction preservation
    - forecast resolution by later Reality
    - same-SHA/profile binding where applicable
  T07:
    dir: tests/T07_learning
    name: Learning, Knowledge and AutoFix
    obligations:
    - quarantine/poisoning/lineage quality
    - promotion/demotion/revalidation
    - OpenQuestion/MissingPiece/Hypothesis/Experiment
    - Lesson begins unverified
    - bounded patch/rollback/catastrophic-forgetting guard
    - re-audit the fixer
  T08:
    dir: tests/T08_runtime
    name: Runtime Closed Loop and Soak
    obligations:
    - real read-understand-plan-act-observe-verify path
    - bounded resource and soak profiles
    - projection determinism
    - long-running mission lifecycle when applicable
  T09:
    dir: tests/T09_golden_task
    name: Golden End-to-End
    required_scenarios_for_complete_scp:
    - id: GOLDEN_A_AGENT_OS
      minimum_level: C
    - id: GOLDEN_B_SELF_IMPROVEMENT
      minimum_level: C
    - id: GOLDEN_C_WORLD_INTELLIGENCE
      minimum_level: C
    - id: GOLDEN_D_AUTONOMOUS_COORDINATION
      minimum_level: C
    - id: GOLDEN_E_EXTERNAL_AUTHORITY_CONTINUITY
      minimum_level: C
    rule: Future Golden scenarios remain structural requirements even before their phase is implemented.
  T10:
    dir: tests/T10_recovery
    name: D-Level Recovery and Chaos
    obligations:
    - hard-kill/restart/timeout
    - post-side-effect uncertainty
    - resume/rollback/reconcile/BLOCKED/UNKNOWN semantics
    - no duplicate external side effects
    - authority/projection recovery
  T11:
    dir: tests/T11_release
    name: Release and Handoff
    obligations:
    - tested SHA
    - Complete SCP reference hash/version
    - DNA hash
    - required Skill hashes
    - test profile/config/runtime/manifest hashes
    - mandatory blockers=0
    - fresh post-main-handoff verification when release semantics require it
