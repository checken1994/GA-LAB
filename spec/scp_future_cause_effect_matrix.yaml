    - schema_version
    - event_id
    - event_type
    - timestamp
    - trace_id
    - task_id
    - attempt_id
    - actor
    - subject_refs
    - policy_hash
    - payload
    - evidence_refs
    - data_class
    - integrity.content_hash
  data_classes:
  - PUBLIC
  - INTERNAL
  - SENSITIVE
  - SECRET
  epistemic_verdicts:
  - VERIFIED
  - CONTRADICTED
  - INSUFFICIENT
  - UNKNOWN
  evidence_levels:
