open_questions_required:
- id: OQ01
  question: Khi nào storage authority phải vượt SQLite và migration authority thay đổi ra sao?
- id: OQ02
  question: Lineage resolver deterministic có thể đạt đến mức nào trước khi cần semantic assistance?
- id: OQ03
  question: Làm sao qualification model miễn phí tránh benchmark overfit và stale capability?
- id: OQ04
  question: Revalidation cadence tối ưu theo từng domain/volatility là gì?
- id: OQ05
  question: External authority connectors nào thực sự được ủy quyền và ở phạm vi nào?
- id: OQ06
  question: Privacy/retention theo jurisdiction nào và policy nào được ưu tiên khi xung đột?
- id: OQ07
  question: Digital Twin cần fidelity nào trước khi dùng cho từng loại action/risk?
- id: OQ08
  question: Hai independent verifier bất đồng thì resolution authority nào được dùng?
- id: OQ09
  question: Causal inference verified-free nào đủ tốt theo từng task class?
- id: OQ10
  question: Knowledge graph partition/rebuild authority vận hành thế nào khi scale?
- id: OQ11
  question: Information-gain scheduler chống source bias và feedback loop thế nào?
- id: OQ12
  question: Phát hiện long-term poisoning và giả independent lineage bằng cách nào?
- id: OQ13
  question: Quota phân bổ user task, verification, learning và curiosity thế nào?
- id: OQ14
  question: Self-fix test infrastructure được phép tự sửa đến đâu để tránh Goodhart?
- id: OQ15
  question: Những authority nào vĩnh viễn human-owned hoặc non-self-modifiable?
coverage_contract:
  required:
    core_systems: 12
    cross_cutting_systems: 8
    test_gates: 12
    phases: 5
  every_core_system_must_have:
  - name
  - purpose
  - phase_focus
  - authority_owners
  - capabilities
  - depends_on
  - forbidden_paths
  - cause_effect_edges
  every_capability_must_have:
  - id
  - target_maturity
  - phase
  every_cause_effect_edge_must_have:
  - id
  - cause
  - authority_path
  - effects
  - must_not_effect
  - evidence_target
  - gates
  every_cross_cutting_system_must_have:
  - name
  - purpose
  - phase_focus
  - capabilities
  - forbidden_paths
  - gates
  - cause_effect_edges
  - phase_focus
  fail_if:
  - required_core_system_missing
  - required_cross_cutting_system_missing
  - required_phase_missing
  - required_test_gate_missing
  - orphan_capability_without_owner
  - capability_without_phase_or_maturity
  - system_without_cause_effect_edge
  - cause_effect_without_test_gate
  - authority_path_bypasses_governance_when_side_effectful
  - epistemic_path_bypasses_evidence
  - recovery_semantics_missing_for_side_effectful_or_durable_capability
  - future_required_capability_omitted_because_not_yet_implemented
  - zero_cost_invariant_weakened
  - external_alert_human_authority_weakened
  - same_sha_release_binding_removed
  semantic_red_flags:
  - paid fallback
  - complex task -> paid
  - confidence -> VERIFIED
  - source count -> independent support
  - external data -> Knowledge
  - Knowledge -> direct action
  - RiskAuthority -> direct tool
  - forecast -> fact
  - correlation -> CAUSES
  - simulation PASS -> production PASS
  - restart -> blind retry
  - same name -> same entity
  - current state overwrite history
  completion_rule: 'structural_verdict may be STRUCTURALLY_COMPLETE only when validator finds zero missing required
    systems, zero orphan capabilities, zero uncovered cause-effect obligations, zero forbidden dependency violations
    and zero mandatory T00-T11 mapping gaps.

    '
  implementation_status_rule: Implementation status is not hard-coded as architectural truth; validator reads live
    Self-Model, implementation_bindings and same-SHA evidence. Missing implementation never removes the capability
    from this matrix.
structural_coverage_summary:
  core_systems_required: 12
  core_systems_declared: 12
  cross_cutting_required: 8
  cross_cutting_declared: 8
  phases_required: 5
  phases_declared: 5
  gates_required: 12
  gates_declared: 12
  declared_structural_scope: ENTIRE_COMPLETE_SCP
  structural_verdict: STRUCTURALLY_COMPLETE_BY_DECLARATION_PENDING_MACHINE_VALIDATION
  runtime_verdict: NOT_DERIVED_FROM_THIS_FILE
  capabilities_declared: 110
  cause_effect_edges_declared: 38
release_interpretation:
  this_file_can_prove:
  - Complete SCP structural requirement is explicitly represented.
  - Cause-effect and cross-gate obligations are specified.
  - Future capabilities remain visible even when implementation is missing.
  this_file_cannot_prove:
  - capability implementation exists
  - capability maturity
  - runtime correctness
  - release readiness
  - Complete SCP DONE
  scoped_phase_verdict_templates:
    P0: 26-P0 Foundation verified within P0 scope on evidence snapshot SHA X.
    P1: 26-P1 Cognitive Control Plane verified within P1 scope on evidence snapshot SHA X.
    P2: 26-P2 World Intelligence Plane verified within P2 scope on evidence snapshot SHA X.
    P3: 26-P3 Autonomous Coordination Plane verified within P3 scope on evidence snapshot SHA X.
    P4: 26-P4 External Operation and Continuity Plane verified within P4 scope on evidence snapshot SHA X.
